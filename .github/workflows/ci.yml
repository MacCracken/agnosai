name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Sync the pinned stdlib snapshot
        # Cyrius 6.x: `lib sync --full` provisions ./lib/ from the pinned
        # snapshot; `cyrius deps` only OVERLAYS [deps.NAME] on top. deps alone
        # against an empty ./lib/ fails on the stdlib leaves each dep's
        # dist/<pkg>.deps sidecar names.
        # Its error claims the module "is not in the cyrius stdlib" — that is
        # false; filed as cyrius 2026-08-12-agnosai-deps-misleading-stdlib-error.
        run: cyrius lib sync --full

      - name: Resolve dependencies
        run: cyrius deps

      - name: Lockfile is honest
        # `cyrius deps` above resolved every [deps.NAME] from `git` + `tag`,
        # because a runner has none of the sibling checkouts that `path =
        # "../NAME"` points at locally. A developer who DOES have them builds
        # against the path, which WINS over the tag — so the two can silently
        # diverge, and on 2026-08-03 they had: lib/kavach.cyr was 3.11.0 locally
        # while cyrius.cyml pinned 3.9.3, which is what this job was compiling.
        #
        # ⚠ **Compared SORTED, not byte-for-byte.** `cyrius deps` writes the
        # hash lines in resolution order, which is filesystem-iteration order and
        # therefore differs between machines — the same 113 files, shuffled. A
        # plain `git diff --exit-code` fails on that shuffle alone and can never
        # pass from a different host, which is what it did on 2026-08-14: every
        # commit pin and every hash matched, only the line order moved.
        #
        # Sorting costs nothing and keeps the whole guarantee: a changed hash, a
        # changed/missing commit pin, or an added/removed file all still fail.
        run: |
          set -o pipefail
          git show HEAD:cyrius.lock | sort > /tmp/lock.committed
          sort cyrius.lock > /tmp/lock.fresh
          if ! diff -u /tmp/lock.committed /tmp/lock.fresh; then
            echo
            echo "::error::cyrius.lock does not match a clean tag-only resolution."
            echo "The diff above is CONTENT, not ordering — ordering is normalised."
            echo
            echo "Most likely the lock was committed after a local build: the"
            echo "'path = \"../NAME\"' overrides win locally, so no commit pins get"
            echo "written. Any 'cyrius deps' / 'cyrius build' / 'cyrius tests' does it."
            echo
            echo "Fix, as the LAST step before committing (after all building/testing):"
            echo "    ./scripts/lock-refresh.sh && git add cyrius.lock"
            exit 1
          fi
          echo "Lockfile matches a clean tag-only resolution ($(grep -c '^commit' cyrius.lock) commit pins)."

      - name: Symbol check
        # Cyrius has ONE flat namespace and last-definition-wins. The compiler
        # warns on a duplicate `fn` and is SILENT on a duplicate `var` or enum
        # member — so grepping the build log structurally cannot catch the worst
        # case. An audit on 2026-07-31 found four duplicated enum constants,
        # three with different values and three of them struct sizes passed
        # straight to alloc(). This gate covers all definition kinds, and also
        # enforces the agnosai_* prefix that keeps src/ clear of lib/'s ~180
        # unprefixed exports.
        run: ./scripts/check-symbols.sh

      - name: Cleanliness check
        # fmt, lint, doc, vet, deny — CLAUDE.md's work loop runs these at steps
        # 2 and 6, but until 2026-07-31 CI ran none of them. `cyrius doc --check`
        # had drifted to 31 undocumented public symbols across five modules and
        # `cyrius lint` to four untracked deferrals, entirely unreported.
        #
        # fmt/lint/doc each take a FILE — bare, they print usage and exit 1 — so
        # the script loops rather than invoking them once.
        run: ./scripts/check-clean.sh

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Install wasmtime
        # ⚠ **Without this, every WASM path in the suite SKIPS.** The tests are
        # guarded on `agnosai_wasm_available()`, so a runner with no runtime
        # takes the no-runtime arm and the execute paths — fuel budget, memory
        # ceiling, stdin delivery, stdout capture — go unexercised. That is
        # exactly the class of bug ADR 019 records: two defects survived because
        # nothing had ever run a real module. CI asserting the skip arm is not
        # the same as CI testing WASM.
        #
        # ⚠ It must land on a path kavach PROBES: `/usr/local/bin/wasmtime`,
        # `/usr/bin/wasmtime`, then `$HOME/.cargo/bin/wasmtime`
        # (lib/kavach.cyr:2964). The upstream `wasmtime.dev/install.sh` puts it
        # in `~/.wasmtime/bin`, which is NOT probed and would silently keep the
        # tests skipping.
        #
        # The version is pinned deliberately: this is a test dependency whose
        # behaviour the suite asserts against (a fuel budget of 1 must exhaust; a
        # 128 MiB guest must be refused under a 64 MiB ceiling), so a silent
        # upgrade could change a result. Unlike the cyrius pin, it has no
        # manifest to read it from.
        run: |
          set -euo pipefail
          WASMTIME_VERSION=47.0.3
          ASSET="wasmtime-v${WASMTIME_VERSION}-x86_64-linux"
          curl -sSfL -o /tmp/wasmtime.tar.xz \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${ASSET}.tar.xz"
          tar -xJf /tmp/wasmtime.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/${ASSET}/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version
          # Fail loudly here rather than letting the suite quietly skip.
          test -x /usr/local/bin/wasmtime

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        #
        # ⚠ **Print WHICH suite failed.** `cyrius test` exits non-zero and its
        # per-suite results are buried in thousands of lines of build warnings,
        # so a red run says only "exit code 1". Diagnosing one cost several
        # round-trips on 2026-08-14 — the tail of the log shows passing suites
        # and the failing one scrolls away. Surface it explicitly.
        run: |
          set -o pipefail
          cyrius test 2>&1 | tee /tmp/agnosai-test.log
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::group::Failing suites"
            awk '/^=== /{n=$2}
                 /passed, [0-9]+ failed/{split($0,a," "); if (a[3]+0 != 0) print n"  ->  "$0}' \
              /tmp/agnosai-test.log | tee /tmp/agnosai-failed.txt
            echo "::endgroup::"
            echo "::group::Failed assertions"
            grep -E '^\s+FAIL:' /tmp/agnosai-test.log | head -40 || true
            echo "::endgroup::"
            while read -r line; do
              [ -n "$line" ] && echo "::error::suite failed: $line"
            done < /tmp/agnosai-failed.txt
          fi
          exit "$rc"

      - name: Coverage
        # CLAUDE.md specifies this as its own CI step. It is reference coverage —
        # a floor, not a correctness proof — which is exactly why it earns a
        # gate rather than a claim: it catches a public symbol no test names at
        # all, and nothing more.
        run: cyrius coverage --min 80

      - name: Examples
        # examples/ is discovered by NOTHING — not `cyrius tests`, not
        # `cyrius bench`, not the build entry in cyrius.cyml. Added 2026-08-10
        # together with the first example, because a file nothing compiles is
        # exactly how three .bcyr files rotted into undefined-symbol errors
        # without anyone noticing.
        run: |
          for f in examples/*.cyr; do
            [ -e "$f" ] || continue
            cyrius build "$f" "build/$(basename "$f" .cyr)"
          done

      - name: Fuzz harnesses
        # `cyrius fuzz` runs fuzz/*.fcyr AND tests/*.fcyr. Added 2026-08-10 with
        # the first real harnesses: the tree had carried a `cyrius port` scaffold
        # (`tests/agnosai.fcyr`) whose `fuzz_main` returned 0 without reading its
        # input, and nothing in CI ran it, so it had reported "1 passed" against
        # a harness that tested nothing since 2026-07-28.
        run: cyrius fuzz

      - name: Benchmarks
        # Added 2026-08-10, because NOTHING in CI compiled benches/ and three of
        # the six .bcyr files had rotted into hard undefined-symbol errors —
        # stale include lists against a src/ that had moved under them. 50 of
        # the tree's 79 benchmarks, including the whole 35-shape orchestration
        # set, had stopped running.
        #
        # `cyrius bench` DOES exit 1 on a compile error, so the gate was never
        # silent — it simply was never invoked. `scripts/bench-history.sh` runs
        # it under `set -euo pipefail` and would have aborted, but three days
        # passed between the last run (2026-08-07, 89 rows) and the discovery.
        #
        # This step exists for the COMPILE, not the numbers: CI timings are too
        # noisy to gate on, and bench-history.csv is recorded from a quiet
        # machine. A benchmark that stops compiling reports nothing, and nothing
        # looks exactly like no regression.
        run: cyrius bench
